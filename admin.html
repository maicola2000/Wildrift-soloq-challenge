<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Wild Rift Challenge</title>
<style>body{margin:0;background:#050d18;color:#eef8ff;font-family:Inter,system-ui,Arial}main{max-width:1000px;margin:auto;padding:25px}input,button,select{padding:10px;border-radius:8px;border:1px solid #294b66;background:#0b1c2e;color:#fff;margin:4px}button{cursor:pointer}.panel{background:#0a1828;border:1px solid #193750;border-radius:16px;padding:16px;margin:15px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #173149;padding:10px 0}.danger{color:#ff9aad}</style></head><body><main>
<h1>🐢 Panel de administrador</h1><p>Este panel necesita autenticación y una base de datos para funcionar online.</p>
<div class="panel"><h3>Participante</h3><input id="name" placeholder="Nombre"><input id="rank" placeholder="Rango"><button onclick="add()">Añadir</button></div>
<div class="panel"><h3>Acciones</h3><div id="list">Cargando…</div></div>
<script>
const SUPABASE_URL = 'https://zlnxsbvpqxsalmdmuqnr.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_anmKSXQwmQJwJlQ7ycSBRg_aU6CFm-b';

async function load() {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/participants?select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const players = await r.json();

    list.innerHTML = players.map(p => `
      <div class="row">
        <b>${p.name}</b>
        <span>${p.rank || 'Sin rango'} · ${p.games_played} partidas · ${p.wins} victorias</span>
      </div>
    `).join('');
  } catch (e) {
    list.textContent = 'Error al conectar con Supabase.';
  }
}

async function add() {
  const n = name.value.trim();
  const r = rank.value.trim();

  if (!n) return;

  await fetch(`${SUPABASE_URL}/rest/v1/participants`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=minimal'
    },
    body: JSON.stringify({
      name: n,
      rank: r,
      games_played: 0,
      wins: 0,
      losses: 0,
      active: true
    })
  });

  name.value = '';
  rank.value = '';
  load();
}

load();
</script>/main></body></html>
