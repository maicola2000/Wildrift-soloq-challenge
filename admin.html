<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Wild Rift Challenge</title>

<style>
body{
  margin:0;
  background:#050d18;
  color:#eef8ff;
  font-family:Inter,system-ui,Arial
}
main{
  max-width:1000px;
  margin:auto;
  padding:25px
}
input,button,select{
  padding:10px;
  border-radius:8px;
  border:1px solid #294b66;
  background:#0b1c2e;
  color:#fff;
  margin:4px
}
button{
  cursor:pointer
}
.panel{
  background:#0a1828;
  border:1px solid #193750;
  border-radius:16px;
  padding:16px;
  margin:15px 0
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  border-bottom:1px solid #173149;
  padding:10px 0
}
.danger{
  color:#ff9aad
}
</style>
</head>

<body>
<main>

<h1>🐢 Panel de administrador</h1>

<p>Este panel necesita autenticación y una base de datos para funcionar online.</p>

<div class="panel">
  <h3>Participante</h3>

  <input id="name" placeholder="Nombre">
  <input id="rank" placeholder="Rango">

  <button onclick="add()">Añadir</button>
</div>

<div class="panel">
  <h3>Participantes</h3>
  <div id="list">Cargando…</div>
</div>

<script>

const SUPABASE_URL = 'https://zlnxsbvpqxsalmdmuqnr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_anmKSXQwmQJwJlQ7ycSBRg_aU6CFm-b';

const nameInput = document.getElementById('name');
const rankInput = document.getElementById('rank');
const list = document.getElementById('list');


async function load() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/participants?select=*`,
      {
        method: 'GET',

        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const text = await response.text();

    if (!response.ok) {
      throw new Error(
        `Supabase ${response.status}: ${text}`
      );
    }

    const players = JSON.parse(text);

    if (players.length === 0) {
      list.innerHTML =
        '<p>No hay participantes todavía.</p>';
      return;
    }

    list.innerHTML = players.map(p => `
      <div class="row">
        <b>${p.name}</b>
        <span>
          ${p.rank || 'Sin rango'} ·
          ${p.games_played || 0} partidas ·
          ${p.wins || 0} victorias ·
          ${p.losses || 0} derrotas
        </span>
      </div>
    `).join('');

  } catch (error) {

    console.error(error);

    list.innerHTML =
      '<p style="color:#ff9aad;">' +
      '<b>Error al conectar con Supabase:</b><br>' +
      error.message +
      '</p>';
  }
}


async function add() {

  const n = nameInput.value.trim();
  const r = rankInput.value.trim();

  if (!n) {
    alert('Escribe un nombre.');
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/participants`,
      {
        method: 'POST',

        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        },

        body: JSON.stringify({
          name: n,
          rank: r,
          games_played: 0,
          wins: 0,
          losses: 0,
          active: true
        })
      }
    );

    const text = await response.text();

    if (!response.ok) {
      throw new Error(
        `Supabase ${response.status}: ${text}`
      );
    }

    nameInput.value = '';
    rankInput.value = '';

    await load();

    alert('¡Participante añadido correctamente!');

  } catch (error) {

    console.error(error);

    alert(
      'Error al añadir participante:\n\n' +
      error.message
    );
  }
}


load();

</script>

</main>
</body>
</html>
